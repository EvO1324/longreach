#
# Updates this crew centre to a release, deploys the API to Fly.io (needs the
# FLY_API_TOKEN secret) and pushes, which makes Vercel rebuild the site.
# Started from Admin › Updates, or by hand under Actions.
name: Crew centre update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release to update to, e.g. v1.2.0
        required: true
      upstream:
        description: Repository the updates come from
        required: true
        default: EvO1324/longreach

permissions:
  contents: write

concurrency: crewcentre-update

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # only needed while the crew centre's repository is private
      UPSTREAM_TOKEN: ${{ secrets.CREWCENTRE_UPSTREAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge ${{ inputs.version }}
        run: |
          git config user.name "crew centre updates"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$UPSTREAM_TOKEN" ]; then
            git remote add upstream "https://x-access-token:${UPSTREAM_TOKEN}@github.com/${{ inputs.upstream }}.git"
          else
            git remote add upstream "https://github.com/${{ inputs.upstream }}.git"
          fi
          git fetch --no-tags upstream "refs/tags/${{ inputs.version }}:refs/tags/${{ inputs.version }}"
          git merge --no-edit "${{ inputs.version }}" -m "Update the crew centre to ${{ inputs.version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # the release's tag is the version, so nobody has to bump it by hand
      - name: Set the version to ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION.replace(/^v/, "");
            for (const f of ["package.json", "server/package.json", "package-lock.json", "server/package-lock.json"]) {
              if (!fs.existsSync(f)) continue;
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              p.version = v;
              if (p.packages && p.packages[""]) p.packages[""].version = v;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + "\n");
            }'
          git commit -am "Crew centre version ${VERSION#v}" || true
          git push

      - name: Apply the brand
        run: node scripts/brand.js

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''

      - name: Deploy the API to Fly.io
        if: env.FLY_API_TOKEN != ''
        working-directory: server
        run: flyctl deploy --remote-only
