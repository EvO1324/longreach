# fly.toml: the crew centre's PocketBase on Fly.io. See DEPLOYING.md.
app = 'my-crewcentre-db'  # your Fly app's name (fly launch picks one)
primary_region = 'syd'    # the same region as your API

[build]

# The database lives here, so it survives deploys and restarts
[mounts]
  source = 'pb_data'
  destination = '/pb/pb_data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'   # a database should stay up
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
